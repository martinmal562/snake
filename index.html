<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css"> 
</head>
<body class="body">
    <div class="header">
        <h1 class="pagetitle">nadpis idk</h1>
    </div>
    <div class="games">
        <div class="game">
            <h1 class="gamehead">SNAKE</h1>
            <canvas id="snakefield" width="400" height="400"></canvas>
            <br>
            <button onclick="snakeRestart()" class="restart" id="snakerestart">start</button>
            <p id="snakeScore" class="score">Score: 0</p>

            <div class="snakecontrols"> 
                <button onclick="snakeKeypress('w')" class="button up">A</button>
                <button onclick="snakeKeypress('s')" class="button down">V</button>
                <button onclick="snakeKeypress('a')" class="button left">&lt</button>
                <button onclick="snakeKeypress('d')" class="button right">&gt</button>
            </div>
        </div>
        <div class="game">
            <h1 class="gamehead">HANGMAN</h1>
            <canvas id="hangfield" width="400" height="350"></canvas>
            <br>
            <canvas id="hangword" width="400" height="50"></canvas>
            <br>
            <button onclick="hangRestart()" class="restart" id="hangrestart">start</button>


            <div class="hangcontrolsT"> 
                <button id="q" onclick="hangKeypress('q')" class="keybutton q">Q</button>
                <button id="w" onclick="hangKeypress('w')" class="keybutton w">W</button>
                <button id="e" onclick="hangKeypress('e')" class="keybutton e">E</button>
                <button id="r" onclick="hangKeypress('r')" class="keybutton r">R</button>
                <button id="t" onclick="hangKeypress('t')" class="keybutton t">T</button>
                <button id="y" onclick="hangKeypress('y')" class="keybutton y">Y</button>
                <button id="u" onclick="hangKeypress('u')" class="keybutton u">U</button>
                <button id="i" onclick="hangKeypress('i')" class="keybutton i">I</button>
                <button id="o" onclick="hangKeypress('o')" class="keybutton o">O</button>
                <button id="p" onclick="hangKeypress('p')" class="keybutton p">P</button>
            </div>
            <div class="hangcontrolsM"> 
                <button id="a" onclick="hangKeypress('a')" class="keybutton q">A</button>
                <button id="s" onclick="hangKeypress('s')" class="keybutton w">S</button>
                <button id="d" onclick="hangKeypress('d')" class="keybutton e">D</button>
                <button id="f" onclick="hangKeypress('f')" class="keybutton r">F</button>
                <button id="g" onclick="hangKeypress('g')" class="keybutton t">G</button>
                <button id="h" onclick="hangKeypress('h')" class="keybutton y">H</button>
                <button id="j" onclick="hangKeypress('j')" class="keybutton u">J</button>
                <button id="k" onclick="hangKeypress('k')" class="keybutton i">K</button>
                <button id="l" onclick="hangKeypress('l')" class="keybutton o">L</button>
            </div>
            <div class="hangcontrolsM"> 
                <button id="z" onclick="hangKeypress('z')" class="keybutton w">Z</button>
                <button id="x" onclick="hangKeypress('x')" class="keybutton e">X</button>
                <button id="c" onclick="hangKeypress('c')" class="keybutton r">C</button>
                <button id="v" onclick="hangKeypress('v')" class="keybutton t">V</button>
                <button id="b" onclick="hangKeypress('b')" class="keybutton y">B</button>
                <button id="n" onclick="hangKeypress('n')" class="keybutton u">N</button>
                <button id="m" onclick="hangKeypress('m')" class="keybutton i">M</button>
            </div>
        </div>
    </div>
</body>
<script src="snake.js"></script>
<script src="hangwords.js"></script>
<script src="hangman.js"></script>

</html>
